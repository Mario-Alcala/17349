            function saludar(){
                url = "http://localhost:8081/saludos"
                fetch(url)
                .then(respuesta =>{
                    console.log(respuesta)
                })
                .then(() => {})
                .catch(error => {
                    console.log(error)
                })
            }

            function saludar2(){
                url = "http://localhost:8081/saludos"
                xhttp= new XMLHttpRequest()
                xhttp.onload = () => {
                    console.log( xhttp.reponse)
                }
                xhttp.open("GET", url)
                xhttp.send() 
            }

        </script>
